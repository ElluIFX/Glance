name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - ".github/release-notes/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - ".github/release-notes/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore build dependencies
        uses: actions/cache@v5
        with:
          path: |
            src/Glance.App/third_party/scintilla/bin/x64
            src/Glance.Components/Model3D/third_party/three/bin
            src/Glance.Components/Model3D/third_party/occt-import-js/bin
            src/Glance.Components/Model3D/third_party/esbuild/bin
            src/Glance.Components/Model3D/third_party/web/bin
            src/Glance.Components/Archive/third_party/7zip/bin
          key: glance-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-dependencies.ps1') }}
          restore-keys: |
            glance-dependencies-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Release
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release -Platform x64

      - name: Verify test build output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ".\bin\Release\x64\Glance.Tests.exe" -PathType Leaf)) {
              throw "Glance.Tests.exe was not generated by the Release build"
          }
